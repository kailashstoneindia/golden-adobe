# Local rehearsal of the production stack (see rehearse.sh). Layered over
# docker-compose.prod.yml; changes only what a laptop needs, so what is rehearsed
# is what ships:
#   - Caddy listens on high ports (80 and 443 are often taken locally)
#   - the S3 stand-in is the MinIO container from the root docker-compose.yml
#     (reached through host.docker.internal) instead of AWS
#   - its own compose project name, so it can never touch a dev stack's containers
#     or volumes, nor a real production stack's if this is ever run on the box
name: golden-abode-rehearsal

services:
  caddy:
    ports: !override
      - '18080:80'
      - '18443:443'

  api:
    environment:
      S3_ENDPOINT: http://host.docker.internal:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: golden_dev
      S3_SECRET_ACCESS_KEY: golden_dev_secret
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  backup:
    environment:
      BACKUP_S3_ENDPOINT: http://host.docker.internal:9000
      AWS_ACCESS_KEY_ID: golden_dev
      AWS_SECRET_ACCESS_KEY: golden_dev_secret
      AWS_DEFAULT_REGION: ap-south-1
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  sweep:
    environment:
      S3_ENDPOINT: http://host.docker.internal:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: golden_dev
      S3_SECRET_ACCESS_KEY: golden_dev_secret
    extra_hosts:
      - 'host.docker.internal:host-gateway'
